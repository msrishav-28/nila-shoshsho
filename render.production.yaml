services:
  - type: web
    name: nila-shoshsho-account-production
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: "off"
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: STAGING_ACCESS_KEY
        generateValue: true
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: NEON_AUTH_ISSUER
        sync: false
      - key: NEON_AUTH_AUDIENCE
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: GOV_ID_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BOLNA_CALLBACK_ENABLED
        value: "false"

  - type: web
    name: nila-shoshsho-advice-production
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: "off"
    dockerContext: ./AiBackend
    dockerfilePath: ./AiBackend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: STAGING_ACCESS_KEY
        fromService:
          name: nila-shoshsho-account-production
          type: web
          envVarKey: STAGING_ACCESS_KEY
      - key: ACCOUNT_URL
        fromService:
          name: nila-shoshsho-account-production
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: NEON_AUTH_ISSUER
        sync: false
      - key: NEON_AUTH_AUDIENCE
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PAID_REQUESTS_PER_DAY
        value: "50"
      - key: MET_FORECAST_ENABLED
        value: "true"
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SERP_API_KEY
        sync: false
