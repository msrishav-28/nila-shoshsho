pluginManagement {
    def reactNativeGradlePlugin = providers.exec {
        workingDir(rootDir)
        commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
    includeBuild(new File(reactNativeGradlePlugin).parentFile.absolutePath)

    def expoAutolinkingPackage = providers.exec {
        workingDir(rootDir)
        commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim()
    includeBuild(new File(new File(expoAutolinkingPackage).parentFile, 'android/expo-gradle-plugin').absolutePath)
}

plugins {
    id("com.facebook.react.settings")
    id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { settings ->
    settings.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
}
expoAutolinking.useExpoModules()
expoAutolinking.useExpoVersionCatalog()

rootProject.name = 'MobileApp'
include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
